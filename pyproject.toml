[project]
name = "nicherides-ml-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "joblib>=1.4.0",
  "scikit-learn>=1.8.0",
  "ultralytics",
  "python-multipart",
  "pytesseract",
  "mlflow==3.12.0",
  "boto3"
]

[project.optional-dependencies]
mlflow = [
  "psycopg2-binary>=2.9.10",
  "boto3>=1.34.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
