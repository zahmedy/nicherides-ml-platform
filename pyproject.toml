[project]
name = "nicherides-ml-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.21",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "pydantic-settings>=2.3.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "joblib>=1.4.0",
  "scikit-learn>=1.8.0",
  "ultralytics",
  "opencv-python",
  "pillow",
  "python-multipart"
]

[tool.pytest.ini_options]
pythonpath = ["."]
